/* Bounded mobile canvas and consistent walk controls. */
body{background:#f1eee9}
#shell{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#top{height:52px;flex:0 0 52px;position:relative}
#app{flex:1;min-height:0;overflow-y:auto;padding-bottom:0}
.tabbar{position:relative;bottom:auto;width:100%;flex:0 0 auto;min-height:66px;padding:8px 0 max(8px,env(safe-area-inset-bottom));align-items:center}
.map-canvas{height:100%;min-height:0;background:#e8e9e6;isolation:isolate;overflow:hidden}
.page-walk,.page-explore{overflow:hidden!important}
.map-texture{position:absolute;inset:0;background-image:url("dog-map.svg");background-size:cover;background-position:center;z-index:-1}
.map-label{top:auto;bottom:142px;left:6px;font-size:9px;border-radius:3px;padding:1px 4px}
.map-actions{top:18px;right:18px}
.map-actions>button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0;font-size:24px}
.map-actions:has(.walk-explore){inset:18px 18px 145px auto;display:flex;flex-direction:column;justify-content:space-between}
.map-actions .walk-explore{width:54px;height:54px;align-self:flex-end;background:#ff902a;color:#fff;font-size:14px;border:3px solid white}
.walk-bottom{left:0;right:0;bottom:0;border-radius:22px 22px 0 0;height:118px;padding:28px 16px 16px;box-shadow:0 -4px 22px #00000008;justify-content:space-between}
.walk-bottom>div{min-width:98px;text-align:center}
.walk-bottom>div:first-child p{font-size:clamp(21px,6vw,28px);color:#006ac9}
.walk-bottom>div:last-child p{font-size:28px;color:#ff7300}
.walk-bottom small{font-size:14px;color:#999}
.walk-bottom>.primary{position:absolute;left:50%;top:-25px;transform:translateX(-50%);border-radius:50px;height:58px;min-width:142px;font-size:18px;background:linear-gradient(110deg,#ff982e,#ff7b17);white-space:nowrap;box-shadow:0 9px 18px #ff8b2522}
.detail-map{height:clamp(150px,30dvh,240px);min-height:0;width:100%;position:relative;overflow:hidden;border-radius:16px;flex:none}
.detail-map .map-texture{border-radius:inherit}
.detail-map .map-label{bottom:4px}
.page-historyDetail .container{height:100%;display:flex;flex-direction:column;gap:14px}
.page-historyDetail .white-card{margin-bottom:0;flex:none}
.page-historyDetail .secondary{align-self:center}
.page-profile .recent-records-card>.record-card{padding:10px 0;margin-bottom:5px;box-shadow:none;border-radius:0;border-bottom:1px solid #f1e8df}
.page-profile .recent-records-card>.record-card:nth-of-type(n+4){display:none}
.page-profile .stat-row{margin-top:5px}
.page-profile .stat-row strong{font-size:18px}
@media(min-width:600px){#shell{width:430px;height:calc(100dvh - 32px);max-height:900px;min-height:0;margin:16px auto;border-radius:24px}.map-canvas{height:100%}.detail-map{height:220px}}
@media(max-height:650px){.walk-bottom{height:98px;padding-top:26px}.map-label{bottom:112px}.map-actions:has(.walk-explore){bottom:120px}.detail-map{height:145px}.page-historyDetail .container{gap:8px}.page-historyDetail .white-card{padding:10px}.page-historyDetail .stat-row strong{font-size:18px}}

/* Profile fits within the viewport without page scrolling. */
#app.page-profile{overflow:hidden}
.page-profile>.container{height:100%;min-height:0!important;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:clamp(6px,1.3dvh,12px);padding:clamp(10px,2dvh,16px)!important;overflow:hidden}
.page-profile .user-section{margin:0;padding:0;gap:14px;min-height:0}
.page-profile .user-section img{width:clamp(42px,7dvh,60px);height:clamp(42px,7dvh,60px)}
.page-profile .user-section button{padding:0;border-radius:50%;background:transparent}
.page-profile .achievements-card,.page-profile .recent-records-card{margin:0;padding:clamp(10px,1.6dvh,16px);min-height:0;border-radius:16px}
.page-profile .card-header{margin:0 0 8px;min-height:24px}
.page-profile .card-title{font-size:16px}
.page-profile .badge-grid{gap:clamp(4px,1dvh,10px) 8px}
.page-profile .badge{padding:0;gap:3px;font-size:11px;min-width:0}
.page-profile .badge img{width:clamp(28px,5dvh,46px);height:clamp(28px,5dvh,46px)}
.page-profile .recent-records-card{display:flex;flex-direction:column;overflow:hidden}
.profile-record-list{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));flex:1;min-height:0}
.profile-record{display:flex;align-items:center;justify-content:space-between;gap:6px;background:white;border-bottom:1px solid #f0e8df;padding:0 2px;font-size:clamp(10px,1.7dvh,13px);min-height:0;white-space:nowrap}
.profile-record strong{color:#ed893b;font-weight:600}
.profile-record:last-child{border-bottom:0}
.profile-empty{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px;color:#999;font-size:12px}
.profile-empty .primary{padding:8px 12px;font-size:12px}
.page-profile .contact-button{margin:0;padding:7px 12px;width:100%;height:34px;min-height:0;font-size:13px}
.page-profile>.container>.muted{margin:0;font-size:10px;line-height:1.35}

.portfolio-watermark{position:fixed;inset:0;z-index:45;pointer-events:none;display:flex;flex-direction:column;justify-content:space-around;align-items:center;overflow:hidden}
.portfolio-watermark span{font-size:13px;letter-spacing:2px;color:rgba(92,64,35,.16);transform:rotate(-24deg);white-space:nowrap;user-select:none}
@media(min-width:600px){.portfolio-watermark{width:430px;left:50%;right:auto;transform:translateX(-50%);height:min(900px,calc(100dvh - 32px));top:16px}}

.portfolio-watermark{z-index:80;justify-content:space-evenly;gap:12px;padding:18px 0}
.portfolio-watermark span{text-align:center;font-size:12px;line-height:1.8;letter-spacing:1.3px;color:rgba(91,69,49,.23);transform:rotate(-24deg);flex-shrink:0}
@media(max-height:650px){.portfolio-watermark span{font-size:10px;line-height:1.5}}

const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>'<img alt="" class="'+cls+'" src="'+(images[name]||images['paw-icon'])+'">';
let records=[],checkins=[],nickname='遛狗骑士',session=null;try{records=JSON.parse(localStorage.getItem('doggo-demo-records')||'[]');checkins=JSON.parse(localStorage.getItem('doggo-demo-checkins')||'[]');nickname=localStorage.getItem('doggo-demo-name')||nickname;session=JSON.parse(localStorage.getItem('doggo-demo-session')||'null')}catch{}
let page='home',category='park',city='深圳市',detailId=null,returnPage='profile',toastTimer;
const persist=()=>{try{localStorage.setItem('doggo-demo-records',JSON.stringify(records));localStorage.setItem('doggo-demo-checkins',JSON.stringify(checkins));localStorage.setItem('doggo-demo-name',nickname);localStorage.setItem('doggo-demo-session',JSON.stringify(session))}catch{toast('浏览器未允许保存数据')}};
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',2400)}
function modal(title,body,actions){$('#modal').innerHTML='<div class="dialog-bg"><section class="dialog" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+body+'<div class="dialog-actions">'+actions+'</div></section></div>';$('#modal button')?.focus()}
const close=()=>$('#modal').innerHTML='';const today=()=>new Date().toLocaleDateString();const total=()=>records.reduce((a,r)=>a+Number(r.distance),0);const seconds=()=>session?Math.floor(((session.pausedAt||Date.now())-session.started-session.pausedMs)/1000):0;const time=n=>String(Math.floor(n/3600)).padStart(2,'0')+':'+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function go(p){if(page==='walk'&&p!=='walk'&&session&&!session.pausedAt){session.pausedAt=Date.now();persist();toast('已暂停记录，30 分钟内返回可继续')}if(p==='walk'&&session?.pausedAt){if(Date.now()-session.pausedAt>1800000){saveWalk();toast('暂停超过 30 分钟，记录已保存')}else{modal('继续本次遛狗？','<p>上次遛狗已暂停，是否继续记录？</p>','<button class="secondary" data-action="finish">结束并保存</button><button class="primary" data-action="resume">继续记录</button>')}}page=p;location.hash=p;render();window.scrollTo(0,0)}
function achievementList(){return achievements.map(a=>({...a,completed:a.id==='first_walk'?records.length>=3:a.id==='walking_expert'?total()>=100:a.id==='goal_achiever'?records.length>=50:a.id==='walking_master'?records.length>=50:a.id==='marathon_walker'?records.some(r=>r.distance>=5):false}))}
function badges(all=false){return '<div class="badge-grid">'+achievementList().slice(0,all?99:6).map(a=>'<button class="badge '+(a.completed?'':'locked')+'" data-ach="'+a.id+'">'+icon(a.icon)+'<span>'+esc(a.name)+'</span></button>').join('')+'</div>'}
function stats(r){return '<div class="stat-row"><div><strong>'+r.distance+'</strong><small>公里</small></div><div><strong>'+Math.max(1,Math.round(r.seconds/60))+'</strong><small>分钟</small></div><div><strong>'+Math.round(r.distance*45)+'</strong><small>千卡</small></div><div><strong>'+((r.distance/(r.seconds/3600))||0).toFixed(1)+'</strong><small>公里 / 时</small></div></div>'}
function recordList(){return records.length?records.map(r=>'<button class="record-card" data-record="'+r.id+'"><strong>'+new Date(r.date).toLocaleDateString()+'</strong><span style="float:right">查看详情 ›</span>'+stats(r)+'</button>').join(''):'<div class="white-card empty">'+icon('empty-icon')+'<p>还没有遛狗记录</p><button class="primary" data-go="walk">去遛狗</button></div>'}
function map(detail=false){return '<div class="map-canvas '+(detail?'detail-map':'')+'"><div class="map-texture" aria-hidden="true"></div><span class="map-label">腾讯地图截图 · 模拟轨迹</span><svg class="route" viewBox="0 0 400 650" preserveAspectRatio="none"><path d="M190 340 L150 305 L100 310 L85 250 L160 225 L190 280" fill="none" stroke="'+(detail||session?'#f58a32':'transparent')+'" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="location-dot"></div>'+(detail?'':page==='explore'?exploreControls():'<div class="map-actions"><button data-action="center">◎</button><button class="walk-explore" data-go="explore">探索</button></div><div class="walk-bottom"><div><p id="clock">'+time(seconds())+'</p><small>时间</small></div><button class="primary" data-action="toggle">'+(session?'停止遛狗':'开始遛狗')+'</button><div><p id="km">'+(seconds()*.001).toFixed(2)+'</p><small>模拟公里</small></div></div>')+'</div>'}
function exploreControls(){const cats=[['park','公园','park'],['hospital','宠物医院','hospital'],['pet-store','宠物店','pet-shop'],['restaurant','友好餐厅','restaurant']];return '<div class="explore-top"><select id="city" aria-label="选择城市">'+['深圳市','北京市','上海市','长沙市'].map(c=>'<option '+(c===city?'selected':'')+'>'+c+'</option>').join('')+'</select><div class="categories">'+cats.map(([k,n,i])=>'<button data-category="'+k+'" class="'+(category===k?'selected':'')+'">'+icon(i)+n+'</button>').join('')+'</div></div>'+[0,1,2].map((n)=>'<button class="pin" aria-label="查看示例地点 '+(n+1)+'" data-poi="'+n+'" style="top:'+(35+n*14)+'%;left:'+(20+n*19)+'%">'+icon(cats.find(c=>c[0]===category)[2])+'</button>').join('')+'<div class="map-actions" style="top:auto;bottom:24px"><button data-action="center">◎ 我的位置</button><button data-action="refresh">刷新</button></div>'}
function home(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const done=checkins.includes(d.toLocaleDateString())||records.some(r=>new Date(r.date).toLocaleDateString()===d.toLocaleDateString());return {d,done,i}});let streak=0;for(let i=6;i>=0&&days[i].done;i--)streak++;return '<div class="container"><div class="streak-card"><div class="streak-header"><div class="title-container"><span class="app-title">狗狗Go</span><span class="app-subtitle">和萌宠出发，把散步变成冒险！</span></div><div class="streak-badge"><span class="streak-text">连续 '+streak+' 天</span></div></div><div class="progress-bar-container"><div class="daily-progress">'+days.map(({d,done,i})=>'<button class="progress-item" '+(i===6?'data-action="checkin"':'disabled')+'><span class="progress-circle '+(done?'completed':'pending')+' '+(i===6?'today':'historical')+'">'+(done?icon('paw-icon'):d.getDate())+'</span><span class="day-label">'+(i===6?'今天':(d.getMonth()+1)+'/'+d.getDate())+'</span></button>').join('')+'</div></div></div><div class="achievement-card" data-go="achievements" role="button" tabindex="0"><div class="achievement-header">'+icon('trophy-icon','trophy-icon')+'<span class="card-title">成就展示</span></div><div class="distance-section"><div class="distance-info"><strong class="distance-value">'+total().toFixed(2)+'km</strong><span>目标：200km</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(100,total()/2)+'%"></div></div><p class="progress-percent">'+Math.min(100,total()/2).toFixed(1)+'%</p></div><div class="achievements-list">'+achievementList().slice(0,3).map(a=>'<div class="achievement-item"><div class="achievement-left">'+icon(a.icon,'emoji-icon')+'<span>'+esc(a.name)+'</span></div><span style="margin-left:auto">'+(a.completed?'已达成':'未达成')+'</span></div>').join('')+'</div></div><button class="search-button" data-go="explore">'+icon('start','search-icon')+'<span class="search-text">探索附近遛狗点</span></button></div>'}
function profileRecords(){return records.length?'<div class="profile-record-list">'+records.slice(0,5).map(r=>'<button class="profile-record" data-record="'+r.id+'"><span>'+new Date(r.date).toLocaleDateString()+'</span><strong>'+r.distance+' 公里</strong><span>'+Math.max(1,Math.round(r.seconds/60))+' 分钟 ›</span></button>').join('')+'</div>':'<div class="profile-empty"><p>还没有遛狗记录</p><button class="primary" data-go="walk">去遛狗</button></div>'}
function render(){const sub=!['home','walk','profile'].includes(page);$('#top').innerHTML='<button data-action="back" aria-label="返回">'+(sub?'‹':'')+'</button><strong>'+({home:'狗狗Go',walk:'遛狗导航',profile:'我的',explore:'探索附近',achievements:'成就墙',recentRecords:'最近记录',historyDetail:'遛狗详情'}[page]||'狗狗Go')+'</strong><a href="resume.html" class="backlink" title="Marimo 的面试作品演示">Marimo 作品</a>';$('#app').className='page-'+page;$('.tabbar').innerHTML=[['home','首页'],['walk','遛狗'],['profile','我的']].map(([p,n],i)=>'<button data-go="'+p+'" class="'+(page===p?'active':'')+'">'+icon(['home','paw','user'][i]+(page===p?'-active':''))+'<span>'+n+'</span></button>').join('');let html='';if(page==='home')html=home();if(page==='walk'||page==='explore')html=map();if(page==='profile')html='<div class="container"><div class="user-section"><button data-action="editname">'+icon('user')+'</button><strong>'+esc(nickname)+'</strong></div><div class="achievements-card"><div class="card-header"><span class="card-title">成就墙</span><button class="link" data-go="achievements">查看全部 ›</button></div>'+badges()+'</div><div class="recent-records-card"><div class="card-header"><span class="card-title">最近记录</span><button class="link" data-go="recentRecords">查看全部 ›</button></div>'+profileRecords()+'</div><button class="contact-button" data-action="export">导出我的记录</button><p class="muted">记录保存在当前浏览器，清除浏览器数据后可能丢失。</p></div>';if(page==='achievements')html='<div class="container"><div class="white-card"><h2>我的成就</h2><p class="muted">每一次散步，都值得被记录</p>'+badges(true)+'</div></div>';if(page==='recentRecords')html='<div class="container">'+recordList()+'</div>';if(page==='historyDetail'){const r=records.find(r=>r.id===detailId);html=r?'<div class="container">'+map(true)+'<div class="white-card"><strong>'+new Date(r.date).toLocaleString()+'</strong>'+stats(r)+'</div><button class="secondary" data-action="delete-record">删除这条记录</button></div>':'<div class="empty">记录已不存在<button data-go="recentRecords">返回记录</button></div>'}$('#app').innerHTML=html}
function saveWalk(){if(!session)return;const n=Math.max(1,seconds());records.unshift({id:String(Date.now()),date:new Date().toISOString(),seconds:n,distance:(n*.001).toFixed(2)});session=null;persist()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-action],[data-ach],[data-record],[data-category],[data-poi]');if(!el)return;if(el.dataset.go){go(el.dataset.go);return}if(el.dataset.ach){const a=achievementList().find(a=>a.id===el.dataset.ach);modal(a.name,'<div style="text-align:center">'+icon(a.icon)+'</div><p>'+esc(a.description)+'</p><p class="muted">'+(a.completed?'已达成':'尚未达成')+'</p>','<button class="primary" data-action="close">知道了</button>');return}if(el.dataset.record){detailId=el.dataset.record;go('historyDetail');return}if(el.dataset.category){category=el.dataset.category;render();return}if(el.dataset.poi){const name={park:'公园',hospital:'宠物医院','pet-store':'宠物店',restaurant:'友好餐厅'}[category];modal(name+' · 示例地点 '+(+el.dataset.poi+1),'<p>'+city+' · 演示地点</p><p>距离约 '+(0.6+Number(el.dataset.poi)*.5).toFixed(1)+' 公里</p><p class="muted">地点和地图用于体验交互，实际营业、电话和路线需要在小程序地图服务中查询。</p>','<button class="secondary" data-action="close">关闭</button><button class="primary" data-action="navigate">导航</button>');return}switch(el.dataset.action){case'back':go(page==='historyDetail'?'recentRecords':page==='explore'?'home':'profile');break;case'close':close();break;case'checkin':if(checkins.includes(today()))toast('今天已经打卡啦');else{checkins.push(today());persist();render();toast('打卡成功，明天继续！')}break;case'toggle':if(session)modal('结束本次遛狗？','<p>本次记录将保存到最近记录中。</p>','<button class="secondary" data-action="close">继续遛狗</button><button class="primary" data-action="finish">结束并保存</button>');else modal('开始体验遛狗','<p>网页将使用模拟轨迹演示计时与记录保存。微信版使用设备定位记录真实轨迹。</p>','<button class="secondary" data-action="close">取消</button><button class="primary" data-action="start">开始</button>');break;case'start':session={started:Date.now(),pausedAt:null,pausedMs:0};persist();close();render();break;case'finish':saveWalk();close();go('recentRecords');toast('遛狗记录已保存');break;case'resume':session.pausedMs+=Date.now()-session.pausedAt;session.pausedAt=null;persist();close();render();break;case'editname':modal('编辑昵称','<input id="name" maxlength="20" aria-label="昵称" value="'+esc(nickname)+'">','<button class="secondary" data-action="close">取消</button><button class="primary" data-action="savename">保存</button>');break;case'savename':nickname=$('#name').value.trim()||'遛狗骑士';persist();close();render();break;case'delete-record':modal('删除这条记录？','<p>删除后将更新累计里程与成就。</p>','<button class="secondary" data-action="close">取消</button><button class="primary" data-action="confirm-delete">删除</button>');break;case'confirm-delete':records=records.filter(r=>r.id!==detailId);persist();close();go('recentRecords');break;case'center':toast('已回到演示位置');break;case'refresh':render();toast('已刷新示例地点');break;case'navigate':close();toast('当前为演示地点，请在小程序中体验真实导航');break;case'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='doggo-records.json';a.click();URL.revokeObjectURL(a.href);break}}});document.addEventListener('change',e=>{if(e.target.id==='city'){city=e.target.value;render();toast('已切换到 '+city+' 的演示地点')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click()});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['home','walk','profile','explore','achievements','recentRecords','historyDetail'].includes(p)&&p!==page)go(p)});setInterval(()=>{if(page==='walk'&&session&&!session.pausedAt){$('#clock').textContent=time(seconds());$('#km').textContent=(seconds()*.001).toFixed(2)}},1000);page=['home','walk','profile','explore','achievements','recentRecords'].includes(location.hash.slice(1))?location.hash.slice(1):'home';render();
</script></body></html>
